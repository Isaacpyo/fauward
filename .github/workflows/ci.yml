name: CI
on:
  push:
    branches: [main, develop, 'phase/**']
  pull_request:
  schedule:
    - cron: '17 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fauward_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
      - run: npx prisma db push --schema=apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fauward_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fauward_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage --workspace=apps/backend
      - run: npm run audit:chain:verify --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fauward_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fauward_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fauward_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/backend/coverage
            apps/fauward-Go/coverage
            packages/*/coverage
